name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install pyyaml requests flask
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Sample trees lint clean and plan
        run: |
          for platform in windows macos; do
            python engine/stages/lint_conditions.py --platform "$platform" "tests/fixtures/$platform/manifests"
            python engine/stages/plan_assignments.py --platform "$platform" "tests/fixtures/$platform/manifests"
          done
      - name: Broken trees fail the lint
        run: |
          for platform in windows macos; do
            if python engine/stages/lint_conditions.py --platform "$platform" "tests/fixtures/$platform/broken"; then
              echo "lint passed on the broken $platform tree" >&2
              exit 1
            fi
          done
      - name: PowerShell parses
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors | ForEach-Object { Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" }; $failed = $true }
          }
          if ($failed) { exit 1 }
      - name: Audit suite imports
        working-directory: tools/audit
        run: python -m intune_audit --help
      - name: Pipeline YAML and WDAC XML parse
        run: |
          python - <<'PY'
          import glob, xml.dom.minidom, yaml
          for f in glob.glob("pipelines/**/*.yml", recursive=True):
              yaml.safe_load(open(f))
          for f in glob.glob("policies/**/*.xml", recursive=True):
              xml.dom.minidom.parse(f)
          PY

  action:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [windows, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Lint through the composite action
        uses: ./pipelines/github
        with:
          stage: lint
          platform: ${{ matrix.platform }}
          manifests: tests/fixtures/${{ matrix.platform }}/manifests
      - name: Plan through the composite action
        uses: ./pipelines/github
        with:
          stage: plan
          platform: ${{ matrix.platform }}
          manifests: tests/fixtures/${{ matrix.platform }}/manifests
      - name: Test through the composite action
        uses: ./pipelines/github
        with:
          stage: test
          platform: ${{ matrix.platform }}
