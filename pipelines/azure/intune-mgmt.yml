# Manifest tree -> Intune, as an Azure Pipelines stages template.
#
# A client repo (cimian-gitops, munki-gitops) declares this repo as a resource
# pinned to a tag and calls the template; see pipelines/README.md. The template
# checks out both repos side by side:
#
#   $(Pipeline.Workspace)/s/self           the calling repo (manifests)
#   $(Pipeline.Workspace)/s/intune-gitops  this repo (engine)
#
# The lint stage has dependsOn: [] and gates everything, because the failure it
# catches -- a condition that cannot be translated, skipped in silence -- is
# invisible once the run is underway.

parameters:
  - name: platform
    type: string
    values: [windows, macos]
  - name: manifestsPath
    displayName: 'Manifest tree, relative to the calling repo'
    type: string
  - name: readServiceConnection
    displayName: 'Read-only Azure service connection (Graph *.Read.All) for the whatIf apply'
    type: string
  - name: writeServiceConnection
    displayName: 'Azure service connection that can write to Intune; used only inside the gated apply deployment'
    type: string
  - name: engineRepository
    displayName: 'Resource alias the caller gave this repo'
    type: string
    default: intune_gitops
  - name: environment
    displayName: 'Azure DevOps environment the real apply deploys to; put approvals and checks on it'
    type: string
  - name: defaultBranch
    displayName: 'The only branch a real apply may run from'
    type: string
    default: refs/heads/main
  - name: whatIf
    displayName: 'Plan only: log every write instead of making it'
    type: boolean
    default: true
  - name: validationSteps
    displayName: 'Platform checks the caller runs in the test stage'
    type: stepList
    default: []
  - name: minDesiredAssignments
    type: string
    default: '3'
  - name: protectedProfiles
    displayName: 'Profiles another pipeline owns (path in the calling repo, optional)'
    type: string
    default: ''
  - name: laptopModelsFile
    displayName: 'macOS: laptops Intune reports by identifier (path in the calling repo, optional)'
    type: string
    default: ''
  - name: vmImage
    type: string
    default: ubuntu-latest

stages:
  - stage: lint
    displayName: 'Lint manifest conditions'
    dependsOn: []
    jobs:
      - job: lint
        pool:
          vmImage: ${{ parameters.vmImage }}
        steps:
          - checkout: self
            path: s/self
            fetchDepth: 1
          - checkout: ${{ parameters.engineRepository }}
            path: s/intune-gitops
            fetchDepth: 1
          - script: pip install pyyaml
            displayName: 'Dependencies'
          - script: >
              python3 intune-gitops/engine/stages/lint_conditions.py
              --platform ${{ parameters.platform }}
              'self/${{ parameters.manifestsPath }}'
            workingDirectory: $(Pipeline.Workspace)/s
            displayName: 'Every condition must translate'
            env:
              INTUNE_LAPTOP_MODELS_FILE: ${{ iif(eq(parameters.laptopModelsFile, ''), '', format('self/{0}', parameters.laptopModelsFile)) }}

  - stage: test
    displayName: 'Test'
    dependsOn: lint
    jobs:
      - job: test
        pool:
          vmImage: ${{ parameters.vmImage }}
        steps:
          - checkout: self
            path: s/self
            fetchDepth: 1
          - checkout: ${{ parameters.engineRepository }}
            path: s/intune-gitops
            fetchDepth: 1
          - script: pip install pyyaml requests
            displayName: 'Dependencies'
          - script: python3 -m unittest discover -s tests
            workingDirectory: $(Pipeline.Workspace)/s/intune-gitops
            displayName: 'Engine and group ladder guards'
          - ${{ each step in parameters.validationSteps }}:
            - ${{ step }}

  - stage: plan
    displayName: 'Plan'
    dependsOn: test
    jobs:
      - job: plan
        pool:
          vmImage: ${{ parameters.vmImage }}
        steps:
          - checkout: self
            path: s/self
            fetchDepth: 1
          - checkout: ${{ parameters.engineRepository }}
            path: s/intune-gitops
            fetchDepth: 1
          - script: pip install pyyaml
            displayName: 'Dependencies'
          - script: >
              python3 intune-gitops/engine/stages/plan_assignments.py
              --platform ${{ parameters.platform }}
              'self/${{ parameters.manifestsPath }}'
            workingDirectory: $(Pipeline.Workspace)/s
            displayName: 'Assignments this tree implies'
            env:
              MIN_DESIRED_ASSIGNMENTS: ${{ parameters.minDesiredAssignments }}
              INTUNE_LAPTOP_MODELS_FILE: ${{ iif(eq(parameters.laptopModelsFile, ''), '', format('self/{0}', parameters.laptopModelsFile)) }}

  # Two apply stages, exactly one of which runs. The real one writes to the
  # tenant, so it is a deployment job bound to an environment -- approvals and
  # checks attach there, and Azure DevOps evaluates them before the stage starts
  # -- and it runs only when all three hold: whatIf is false, the build is not a
  # pull request, and it is building the default branch. Anything else runs
  # the whatIf stage, which logs every write and needs no approval.
  #
  # The write connection is referenced only inside the gated deployment job.
  # The whatIf stage signs in with the read-only connection, so a pull request
  # or branch build can never mint a token that writes to the tenant. Lint,
  # test and plan need no connection at all.
  - stage: apply_whatif
    displayName: 'Apply (whatIf)'
    dependsOn: plan
    condition: >-
      and(succeeded(),
          or(eq('${{ lower(parameters.whatIf) }}', 'true'),
             eq(variables['Build.Reason'], 'PullRequest'),
             ne(variables['Build.SourceBranch'], '${{ parameters.defaultBranch }}')))
    jobs:
      - job: apply_whatif
        pool:
          vmImage: ${{ parameters.vmImage }}
        steps:
          - template: steps/apply.yml
            parameters:
              platform: ${{ parameters.platform }}
              manifestsPath: ${{ parameters.manifestsPath }}
              serviceConnection: ${{ parameters.readServiceConnection }}
              engineRepository: ${{ parameters.engineRepository }}
              whatIf: 'true'
              minDesiredAssignments: ${{ parameters.minDesiredAssignments }}
              protectedProfiles: ${{ parameters.protectedProfiles }}
              laptopModelsFile: ${{ parameters.laptopModelsFile }}

  - stage: apply
    displayName: 'Apply'
    dependsOn: plan
    condition: >-
      and(succeeded(),
          eq('${{ lower(parameters.whatIf) }}', 'false'),
          ne(variables['Build.Reason'], 'PullRequest'),
          eq(variables['Build.SourceBranch'], '${{ parameters.defaultBranch }}'))
    jobs:
      - deployment: apply
        environment: ${{ parameters.environment }}
        pool:
          vmImage: ${{ parameters.vmImage }}
        strategy:
          runOnce:
            deploy:
              steps:
                - template: steps/apply.yml
                  parameters:
                    platform: ${{ parameters.platform }}
                    manifestsPath: ${{ parameters.manifestsPath }}
                    serviceConnection: ${{ parameters.writeServiceConnection }}
                    engineRepository: ${{ parameters.engineRepository }}
                    whatIf: 'false'
                    minDesiredAssignments: ${{ parameters.minDesiredAssignments }}
                    protectedProfiles: ${{ parameters.protectedProfiles }}
                    laptopModelsFile: ${{ parameters.laptopModelsFile }}
